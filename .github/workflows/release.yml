name: Build And Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version, without the v prefix
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, Test, Pack And Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore SilkCodec.NET.sln

      - name: Build
        run: dotnet build SilkCodec.NET.sln --configuration Release --no-restore

      - name: Test .NET 8
        run: dotnet test SilkCodec.NET.Tests/SilkCodec.NET.Tests.csproj --configuration Release --framework net8.0 --no-build --no-restore

      - name: Test .NET 10
        run: dotnet test SilkCodec.NET.Tests/SilkCodec.NET.Tests.csproj --configuration Release --framework net10.0 --no-build --no-restore

      - name: Pack
        run: >-
          dotnet pack SilkCodec.NET/SilkCodec.NET.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilkCodec.NET-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Log in to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: greepar

      - name: Publish to NuGet.org
        shell: bash
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
